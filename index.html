<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Review Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>Image Review Tool</h1>
  <p>Paste image URLs • Swipe • Export</p>
</header>

<section class="input-box">
  <textarea id="imageInput" placeholder="Paste image URLs here (one per line)"></textarea>

  <div class="controls">
    <input id="limit" type="number" placeholder="How many to review" value="20">
    <button id="loadBtn">Load Images</button>
  </div>
</section>

<section id="viewer">
  <div id="card">
    <span class="card-overlay nope" aria-hidden="true">Nope</span>
    <span class="card-overlay like" aria-hidden="true">Like</span>
    <img id="img" alt="" />
  </div>
</section>

<div class="actions">
  <button id="nope" type="button" title="Discard (←)">❌</button>
  <button id="undo" type="button" title="Undo">↩</button>
  <button id="yes" type="button" title="Like (→)">❤️</button>
</div>
<p class="keyboard-hint"><kbd>←</kbd> Nope &nbsp; <kbd>→</kbd> Like</p>

<div class="export">
  <button id="copy">📋 Copy Links</button>
  <button id="download">⬇ Download TXT</button>
</div>

  <footer style="text-align:center; margin-top:40px; padding:20px;">
  <a href="https://www.buymeacoffee.com/YOUR_USERNAME" target="_blank">
    <button style="
      background: #FFDD00; 
      color: #000; 
      border: none; 
      border-radius: 8px; 
      padding: 10px 20px; 
      font-size: 16px; 
      font-weight: bold; 
      cursor: pointer;
      transition: transform 0.2s;
    " 
    onmouseover="this.style.transform='scale(1.05)'" 
    onmouseout="this.style.transform='scale(1)'">
      Buy Me a Coffee ☕
    </button>
  </a>
</footer>


<script src="app.js"></script>
</body>
</html>
